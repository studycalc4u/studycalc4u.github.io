<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Practice Game - StudyCalc4U</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5f8;
    color: #1f2933;
    text-align: center;
    user-select: none;
}

.game-header {
    height: 70px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.back-btn,
.timer {
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 16px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.back-btn {
    font-size: 32px;
    color: #278db5;
    cursor: pointer;
}

.progress {
    font-size: 30px;
    font-weight: bold;
    color: #607585;
}

.timer {
    width: 105px;
    font-size: 28px;
    font-weight: bold;
    color: #263238;
    display: flex;
    align-items: center;
    justify-content: center;
}

.progress-bar {
    height: 7px;
    margin: 20px 24px 0;
    background: #e2f1f6;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 2%;
    background: #2991b9;
    transition: width 0.2s;
}

.question-area {
    margin-top: 80px;
}

.question {
    font-size: 78px;
    font-weight: bold;
    letter-spacing: 5px;
}

.answer-display {
    width: 270px;
    min-height: 55px;
    margin: 60px auto 20px;
    border-bottom: 3px solid #2991b9;
    font-size: 40px;
    font-weight: bold;
    color: #263238;
}

.keypad {
    width: min(94%, 650px);
    margin: 260px auto 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.key {
    height: 110px;
    border: none;
    border-radius: 20px;
    background: #278db5;
    color: white;
    font-size: 42px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 5px rgba(0,0,0,0.12);
}

.key:active {
    transform: scale(0.96);
}

.delete-key {
    background: white;
    color: #68aac4;
}

.zero {
    grid-column: 2;
}

@media (max-width: 500px) {

    .game-header {
        padding: 0 16px;
    }

    .progress {
        font-size: 28px;
    }

    .question-area {
        margin-top: 65px;
    }

    .question {
        font-size: 68px;
    }

    .answer-display {
        margin-top: 55px;
    }

    .keypad {
        margin-top: 220px;
        gap: 12px;
    }

    .key {
        height: 95px;
        font-size: 36px;
        border-radius: 18px;
    }
}

</style>
</head>

<body>

<div class="game-header">

    <button class="back-btn" onclick="history.back()">‹</button>

    <div class="progress" id="progress">
        1 / 50
    </div>

    <div class="timer" id="timer">
        0:00
    </div>

</div>

<div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
</div>

<div class="question-area">

    <div class="question" id="question">
        9 + 11
    </div>

    <div class="answer-display" id="answerDisplay"></div>

</div>

<div class="keypad">

    <button class="key" onclick="pressKey(7)">7</button>
    <button class="key" onclick="pressKey(8)">8</button>
    <button class="key" onclick="pressKey(9)">9</button>

    <button class="key" onclick="pressKey(4)">4</button>
    <button class="key" onclick="pressKey(5)">5</button>
    <button class="key" onclick="pressKey(6)">6</button>

    <button class="key" onclick="pressKey(1)">1</button>
    <button class="key" onclick="pressKey(2)">2</button>
    <button class="key" onclick="pressKey(3)">3</button>

    <button class="key zero" onclick="pressKey(0)">0</button>

    <button class="key delete-key" onclick="deleteKey()">⌫</button>

</div>

<script>

let questionNumber = 1;
let totalQuestions = 50;

let score = 0;
let userAnswer = "";

let correctAnswer = 20;

let seconds = 0;

let operation = "+";

const questionElement =
    document.getElementById("question");

const answerDisplay =
    document.getElementById("answerDisplay");

const progressElement =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const timerElement =
    document.getElementById("timer");


function generateQuestion() {

    let num1;
    let num2;

    operation =
        ["+", "-", "×", "÷"]
        [Math.floor(Math.random() * 4)];

    if (operation === "+") {

        num1 = Math.floor(Math.random() * 50) + 1;
        num2 = Math.floor(Math.random() * 50) + 1;

        correctAnswer = num1 + num2;

    }

    else if (operation === "-") {

        num1 = Math.floor(Math.random() * 50) + 1;
        num2 = Math.floor(Math.random() * 50) + 1;

        if (num2 > num1) {
            [num1, num2] = [num2, num1];
        }

        correctAnswer = num1 - num2;

    }

    else if (operation === "×") {

        num1 = Math.floor(Math.random() * 12) + 1;
        num2 = Math.floor(Math.random() * 12) + 1;

        correctAnswer = num1 * num2;

    }

    else {

        num2 = Math.floor(Math.random() * 12) + 1;

        correctAnswer =
            Math.floor(Math.random() * 12) + 1;

        num1 = num2 * correctAnswer;

    }

    questionElement.textContent =
        num1 + " " + operation + " " + num2;

    userAnswer = "";

    answerDisplay.textContent = "";

    progressElement.textContent =
        questionNumber + " / " + totalQuestions;

    progressFill.style.width =
        (questionNumber / totalQuestions * 100) + "%";
}


function pressKey(number) {

    if (userAnswer.length >= 6) {
        return;
    }

    userAnswer += number;

    answerDisplay.textContent =
        userAnswer;

    checkAnswer();
}


function deleteKey() {

    userAnswer =
        userAnswer.slice(0, -1);

    answerDisplay.textContent =
        userAnswer;
}


function checkAnswer() {

    if (Number(userAnswer) === correctAnswer) {

        score += 10;

        setTimeout(function() {

            questionNumber++;

            if (questionNumber > totalQuestions) {

                finishGame();

            } else {

                generateQuestion();

            }

        }, 250);
    }
}


function finishGame() {

    questionElement.textContent =
        "🎉 Game Complete!";

    answerDisplay.textContent =
        score + " Points";

    document.querySelector(".keypad").style.display =
        "none";

    progressElement.textContent =
        "50 / 50";

    progressFill.style.width =
        "100%";
}


setInterval(function() {

    seconds++;

    let minutes =
        Math.floor(seconds / 60);

    let remainingSeconds =
        seconds % 60;

    if (remainingSeconds < 10) {
        remainingSeconds =
            "0" + remainingSeconds;
    }

    timerElement.textContent =
        minutes + ":" + remainingSeconds;

}, 1000);


generateQuestion();

</script>

</body>
</html>
