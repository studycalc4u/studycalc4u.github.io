<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyCalc4U - Free Student Calculators</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .calculator {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .calculator h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            background: #eef4ff;
            border-radius: 7px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>StudyCalc4U</h1>
    <p>Free Calculators & Study Tools for Students</p>
</header>

<div class="container">

    <div class="calculator">
        <h2>📊 Percentage Calculator</h2>

        <input type="number" id="obtained" placeholder="Obtained Marks">

        <input type="number" id="total" placeholder="Total Marks">

        <button onclick="calculatePercentage()">
            Calculate Percentage
        </button>

        <div class="result" id="percentageResult">
            Your result will appear here.
        </div>
    </div>


    <div class="calculator">
        <h2>➗ Average Calculator</h2>

        <input type="text" id="numbers"
               placeholder="Example: 70, 80, 90">

        <button onclick="calculateAverage()">
            Calculate Average
        </button>

        <div class="result" id="averageResult">
            Your result will appear here.
        </div>
    </div>


    <div class="calculator">
        <h2>🎓 CGPA to Percentage</h2>

        <input type="number" step="0.01"
               id="cgpa"
               placeholder="Enter CGPA">

        <button onclick="calculateCGPA()">
            Convert
        </button>

        <div class="result" id="cgpaResult">
            Your result will appear here.
        </div>
    </div>

</div>

<footer>
    © 2026 StudyCalc4U | Free Student Tools
</footer>


<script>

function calculatePercentage() {

    let obtained =
        Number(document.getElementById("obtained").value);

    let total =
        Number(document.getElementById("total").value);

    if (total <= 0) {
        document.getElementById("percentageResult").innerText =
            "Please enter a valid total.";
        return;
    }

    let percentage = (obtained / total) * 100;

    document.getElementById("percentageResult").innerText =
        "Your Percentage: " + percentage.toFixed(2) + "%";
}


function calculateAverage() {

    let input =
        document.getElementById("numbers").value;

    let numbers =
        input.split(",").map(Number).filter(n => !isNaN(n));

    if (numbers.length === 0) {
        document.getElementById("averageResult").innerText =
            "Please enter numbers separated by commas.";
        return;
    }

    let sum =
        numbers.reduce((a, b) => a + b, 0);

    let average =
        sum / numbers.length;

    document.getElementById("averageResult").innerText =
        "Average: " + average.toFixed(2);
}
